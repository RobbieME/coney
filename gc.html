<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GLIZZY CHAD</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            /* iOS Safari: 100% + fill-available + dvh cover old and new iPhones */
            height: -webkit-fill-available;
            height: 100dvh;
            overflow: hidden;
            -webkit-text-size-adjust: 100%;
        }
        body {
            background: linear-gradient(#1a0f0a, #2c1810);
            font-family: Arial, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            justify-content: safe center;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            padding:
                max(4px, env(safe-area-inset-top, 0px))
                max(4px, env(safe-area-inset-right, 0px))
                max(4px, env(safe-area-inset-bottom, 0px))
                max(4px, env(safe-area-inset-left, 0px));
        }
        h1 {
            margin: 0 0 6px;
            font-size: clamp(1rem, 4.5vw, 1.75rem);
            line-height: 1.15;
            text-align: center;
            flex-shrink: 0;
        }
        .game-container {
            position: relative;
            width: 400px;
            flex-shrink: 0;
            /* JS sets final pixel size to fit the screen */
        }
        #game {
            display: block;
            width: 100%;
            height: auto;
            border: 5px solid #ff6b00;
            border-radius: 18px;
            box-shadow: 0 0 40px rgba(255, 107, 0, 0.5);
            background: #111;
            /* Keep canvas drawing buffer 400x600; CSS sizes the display */
        }
        .arrow-btn {
            position: absolute;
            /* Sit above the very bottom so thumbs can reach on short phones */
            bottom: 10%;
            width: 18%;
            max-width: 74px;
            min-width: 56px;
            min-height: 44px; /* Apple HIG minimum touch target */
            aspect-ratio: 1;
            height: auto;
            background: linear-gradient(145deg, #3a2a22, #251c16);
            border: 5px solid #ff6b00;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 8px 22px rgba(0, 0, 0, 0.65),
                inset 0 -6px 10px rgba(0, 0, 0, 0.45),
                0 0 18px rgba(255, 107, 0, 0.35);
            transition: transform 0.08s ease-out, box-shadow 0.08s ease-out, border-color 0.08s;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            touch-action: none;
            z-index: 20;
        }

        .arrow-btn:active {
            transform: scale(0.86);
            box-shadow: 
                0 3px 10px rgba(0, 0, 0, 0.65),
                inset 0 5px 8px rgba(0, 0, 0, 0.6);
            border-color: #ff9f40;
        }

        .left { left: 4%; }
        .right { right: 4%; }

        .arrow-btn svg {
            width: 46%;
            height: 46%;
            stroke: #ffffff;
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .start-btn {
            position: absolute;
            bottom: 28%;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 40px;
            font-size: clamp(18px, 5vw, 26px);
            font-weight: bold;
            letter-spacing: 1px;
            background: #ff6b00;
            color: white;
            border: 5px solid #fff;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            z-index: 15;
            display: none;
            white-space: nowrap;
        }

        #status {
            position: absolute; top: 8%; left: 0; right: 0;
            text-align: center; font-size: clamp(18px, 6vw, 28px); font-weight: bold;
            text-shadow: 0 0 10px #ff6b00; z-index: 10;
        }
    </style>
</head>
<body>
    <h1>🔥 GLIZZY CHAD 🔥</h1>
    <div class="game-container">
        <canvas id="game" width="400" height="600"></canvas>
        <div id="status">READY?</div>
        
        <button id="startBtn" class="start-btn">START</button>

        <button id="leftBtn" class="arrow-btn left">
            <svg width="38" height="38" viewBox="0 0 24 24" fill="none">
                <path d="M15 19L8 12L15 5" stroke="#ff9f40" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M15 19L8 12L15 5" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
        <button id="rightBtn" class="arrow-btn right">
            <svg width="38" height="38" viewBox="0 0 24 24" fill="none">
                <path d="M9 5L16 12L9 19" stroke="#ff9f40" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M9 5L16 12L9 19" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
    </div>

    <script>
        
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');
        const gameContainer = document.querySelector('.game-container');
        const GAME_W = 400;
        const GAME_H = 600;
        // Keep Chad above the on-screen arrow buttons (HTML overlay)
        const PLAYER_Y = 420;

        // Scale the whole game UI so it fits short phone screens (incl. iPhone Safari chrome)
        function fitGameToViewport() {
            const title = document.querySelector('h1');
            const titleH = title ? title.getBoundingClientRect().height + 8 : 0;
            const padX = 8;
            const padY = 8;
            // visualViewport is the reliable size on iOS when the URL bar shows/hides
            const vv = window.visualViewport;
            const availW = Math.max(200, (vv ? vv.width : window.innerWidth) - padX * 2);
            const availH = Math.max(200, (vv ? vv.height : window.innerHeight) - titleH - padY * 2);
            const scale = Math.min(availW / GAME_W, availH / GAME_H, 1);
            const w = Math.max(200, Math.floor(GAME_W * scale));
            const h = Math.floor(w * (GAME_H / GAME_W));
            gameContainer.style.width = w + 'px';
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';
        }

function loadNomSound() {
            if (!audioCtx || nomBuffer) return;
            try {
                const base64Data = NOM_BASE64.split(",")[1];
                const binary = atob(base64Data);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) {
                    bytes[i] = binary.charCodeAt(i);
                }
                audioCtx.decodeAudioData(bytes.buffer).then((buffer) => {
                    nomBuffer = buffer;
                }).catch((e) => console.warn("Failed to decode nom sound", e));
            } catch (e) {
                console.warn("Nom sound load error", e);
            }
        }

        function loadOhYeahSound() {
            if (!audioCtx || ohYeahBuffer) return;
            try {
                const base64Data = OH_YEAH_BASE64.split(",")[1];
                const binary = atob(base64Data);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) {
                    bytes[i] = binary.charCodeAt(i);
                }
                audioCtx.decodeAudioData(bytes.buffer).then((buffer) => {
                    ohYeahBuffer = buffer;
                }).catch((e) => console.warn("Failed to decode oh yeah sound", e));
            } catch (e) {
                console.warn("Oh yeah sound load error", e);
            }
        }

        function drawHotDog(x, y, w, h) {
            if (hotdogImg.complete) {
                ctx.drawImage(hotdogImg, x - 3, y - 6, w + 6, h + 12);
            } else {
                ctx.fillStyle = '#e85a5a';
                ctx.fillRect(x + 4, y + 12, w - 8, h - 24);
            }
        }


        function drawPlayer() {
            const px = player.x, py = player.y, w = player.width, h = player.height;
            const isEating = Date.now() < eatingUntil;
            const img = (isEating && chadEatImg.complete) ? chadEatImg : chadImg;

            if (img.complete) {
                // Quick little squash pop when eating
                let dw = w + 6;
                let dh = h + 10;
                if (isEating) {
                    const t = Math.max(0, (eatingUntil - Date.now()) / 200);
                    const pop = 1 + Math.sin(t * Math.PI) * 0.22;
                    dh *= pop;
                    dw *= (1.05 / pop); // slight horizontal compensation
                }
                ctx.drawImage(img, px - (dw - w) / 2 - 1, py - (dh - h) / 2 - 4, dw, dh);
            } else {
                // Fallback while loading
                ctx.fillStyle = "#ffeb3b";
                ctx.beginPath();
                ctx.ellipse(px + w/2, py + h/2, w*0.47, h*0.47, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#222";
                ctx.beginPath(); ctx.arc(px + w*0.35, py + h*0.38, 4, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(px + w*0.65, py + h*0.38, 4, 0, Math.PI * 2); ctx.fill();
            }
        }
        function spawnHotDog() {
            const w = 40;
            const h = 78;   // tuned for the original hotdog image
            const x = Math.random() * (canvas.width - w - 30) + 15;
            hotdogs.push({
                x: x,
                y: -h - 30,
                width: w,
                height: h,
                vy: 1.5 + Math.random() * 0.7
            });
        }

        function update() {
            if (!gameRunning || gameOver) return;

            const moveSpeed = 7.5;
            if (leftHeld) player.x -= moveSpeed;
            if (rightHeld) player.x += moveSpeed;
            player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));

            for (let i = hotdogs.length - 1; i >= 0; i--) {
                const hd = hotdogs[i];
                const speedBoost = Math.max(0, (hd.y / canvas.height) * 3.5);
                hd.vy += 0.13 + speedBoost * 0.03;
                if (hd.vy > 9.5) hd.vy = 9.5;
                hd.y += hd.vy;

                if (hd.y + hd.height > player.y && hd.y < player.y + player.height &&
                    hd.x < player.x + player.width && hd.x + hd.width > player.x) {
                    score++;
                    hotdogs.splice(i, 1);
                    playCatchSound();
                    eatingUntil = Date.now() + 200;

                    if (score % 11 === 0 && score > 0) {
                        playOhYeahSound();
                        milestoneFlashUntil = Date.now() + 2200;
                    }

                    if (score > highScore) {
                        highScore = score;
                        localStorage.setItem('hongryChadHighScore', highScore);
                    }
                    continue;
                }
                if (hd.y > canvas.height + 50) hotdogs.splice(i, 1);
            }

            if (Date.now() - lastSpawn > 460) {
                spawnHotDog();
                lastSpawn = Date.now();
            }
        }

        function draw() {
            ctx.fillStyle = '#1a120b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let hd of hotdogs) drawHotDog(hd.x, hd.y, hd.width, hd.height);
            drawPlayer();

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 26px Arial';
            ctx.shadowColor = '#ff6b00';
            ctx.shadowBlur = 12;
            ctx.fillText('EATEN: ' + score, 18, 38);
            ctx.fillText('TIME: ' + timeLeft, 18, 70);
            ctx.fillText('BEST: ' + highScore, canvas.width - 125, 38);
            ctx.shadowBlur = 0;


            // Milestone flash every 11 glizzys
            if (Date.now() < milestoneFlashUntil) {
                const remaining = milestoneFlashUntil - Date.now();
                const alpha = Math.max(0.2, remaining / 2200);
                const scale = 1 + Math.sin(Date.now() / 80) * 0.08;

                // Dynamic celebratory text for 11 glizzy milestones
                let line1 = score + " glizzys!";
                let line2 = "NICE!";
                if (score === 11) {
                    line1 = "11 glizzys,";
                    line2 = "nice!";
                } else if (score === 22) {
                    line1 = "another 11 glizzys";
                    line2 = "WOW!";
                } else if (score === 33) {
                    line1 = "33 glizzys!!";
                    line2 = "on fire!";
                } else if (score === 44) {
                    line1 = "44 glizzys!";
                    line2 = "keep going!";
                } else if (score === 55) {
                    line1 = "55 glizzys";
                    line2 = "legendary!";
                } else if (score === 66) {
                    line1 = "66 glizzys";
                    line2 = "unstoppable!";
                } else if (score === 77) {
                    line1 = "77 glizzys";
                    line2 = "glizzy god!";
                } else {
                    line1 = score + " glizzys";
                    line2 = "WOW!";
                }

                ctx.save();
                ctx.globalAlpha = alpha;

                const y = 148;
                ctx.translate(canvas.width / 2, y);
                ctx.scale(scale, scale);

                // Bright main text with nice orange glow
                ctx.fillStyle = '#ffff99';
                ctx.font = 'bold 40px Arial';
                ctx.textAlign = 'center';
                ctx.shadowColor = '#ff6b00';
                ctx.shadowBlur = 22;
                ctx.fillText(line1, 0, 0);

                // Sub text with lighter glow
                ctx.shadowBlur = 14;
                ctx.font = 'bold 20px Arial';
                ctx.fillText(line2, 0, 26);

                ctx.restore();
                ctx.textAlign = 'left';
            }

            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ffeb3b';
                ctx.font = 'bold 46px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('TIME UP!', canvas.width/2, 210);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 32px Arial';
                ctx.fillText('Chad ate ' + score + ' dogs!', canvas.width/2, 270);
                ctx.fillStyle = '#ffeb3b';
                ctx.font = 'bold 24px Arial';
                ctx.fillText('CHAD BE BUSY WITH', canvas.width/2, 315);
                ctx.fillText('THEM GLIZZYS!', canvas.width/2, 345);
                if (score > highScore) {
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 32px Arial';
                    ctx.fillText('NEW HIGH SCORE!', canvas.width/2, 390);
                }
                ctx.fillStyle = '#ff6b00';
                ctx.font = '22px Arial';
                ctx.fillText('Tap screen to play again', canvas.width/2, 440);
                ctx.textAlign = 'left';
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playCatchSound() {
            if (!audioCtx) return;

            if (nomBuffer) {
                const source = audioCtx.createBufferSource();
                source.buffer = nomBuffer;
                // Random pitch for natural variation (each bite sounds a bit different)
                source.playbackRate.value = 0.88 + Math.random() * 0.25;

                const gain = audioCtx.createGain();
                gain.gain.value = 0.7 + Math.random() * 0.45;

                source.connect(gain).connect(audioCtx.destination);
                source.start();
                return;
            }

            // Fallback synth if the real sound has not loaded yet
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(520, audioCtx.currentTime);
            gain.gain.value = 0.4;
            osc.connect(gain).connect(audioCtx.destination);
            osc.start();
            osc.frequency.linearRampToValueAtTime(180, audioCtx.currentTime + 0.25);
            gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.28);
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function playOhYeahSound() {
            if (!audioCtx || !ohYeahBuffer) return;
            const source = audioCtx.createBufferSource();
            source.buffer = ohYeahBuffer;
            const gain = audioCtx.createGain();
            gain.gain.value = 0.85;
            source.connect(gain).connect(audioCtx.destination);
            source.start();
        }

        function playTickSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.value = 920;
            gain.gain.value = 0.15;
            osc.connect(gain).connect(audioCtx.destination);
            osc.start();
            gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (gameRunning && !gameOver) {
                    timeLeft--;
                    playTickSound();
                    if (timeLeft <= 0) {
                        gameOver = true;
                        clearInterval(timerInterval);
                    }
                }
            }, 1000);
        }

        function startTheGame() {
            startBtn.style.display = 'none';
            gameRunning = true;
            statusText.style.display = 'none';
            initAudio();
            loadNomSound();
            loadOhYeahSound();
            startTimer();
        }

        function restartGame() {
            startBtn.style.display = 'none';
            score = 0;
            timeLeft = 30;
            gameOver = false;
            hotdogs = [];
            player.x = 170;
            player.y = PLAYER_Y;
            lastSpawn = Date.now();
            milestoneFlashUntil = 0;
            eatingUntil = 0;
            for (let i = 0; i < 3; i++) {
                spawnHotDog();
                hotdogs[i].y = -80 - i * 80;
            }
            startTimer();
        }

        function initGame() {
            fitGameToViewport();
            window.addEventListener('resize', fitGameToViewport);
            window.addEventListener('orientationchange', () => setTimeout(fitGameToViewport, 100));
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', fitGameToViewport);
            }

            for (let i = 0; i < 3; i++) {
                spawnHotDog();
                hotdogs[i].y = -60 - i * 90;
            }
            draw();

            const leftBtn = document.getElementById('leftBtn');
            const rightBtn = document.getElementById('rightBtn');

            function bindHold(btn, setHeld) {
                btn.addEventListener('touchstart', e => { e.preventDefault(); setHeld(true); }, {passive: false});
                btn.addEventListener('touchend', () => setHeld(false));
                btn.addEventListener('touchcancel', () => setHeld(false));
                btn.addEventListener('mousedown', () => setHeld(true));
                btn.addEventListener('mouseup', () => setHeld(false));
                btn.addEventListener('mouseleave', () => setHeld(false));
            }
            bindHold(leftBtn, v => { leftHeld = v; });
            bindHold(rightBtn, v => { rightHeld = v; });

            // Keyboard support (desktop / bluetooth keyboards)
            window.addEventListener('keydown', e => {
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') leftHeld = true;
                if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') rightHeld = true;
            });
            window.addEventListener('keyup', e => {
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') leftHeld = false;
                if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') rightHeld = false;
            });

            startBtn.addEventListener('click', () => {
                startBtn.style.display = 'none';
                startTheGame();
            });

            canvas.addEventListener('touchstart', () => { if (gameOver) restartGame(); });
            canvas.addEventListener('click', () => { if (gameOver) restartGame(); });

            startBtn.style.display = 'block';
            requestAnimationFrame(gameLoop);
        }

        initGame();
    </script>
</body>
